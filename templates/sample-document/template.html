<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="letterhead">
      <!-- <img src="assets/letterhead.png" alt="Letterhead" /> -->
      <h1>{{subject}}</h1>
      <p class="meta">Document ID: {{documentId}} · {{date}}</p>
    </header>

    <section class="body">
      <p>To: {{recipientName}}</p>
      <p>{{body}}</p>
    </section>

    <footer class="signature">
      <!-- <img src="assets/signature.png" alt="Signature" /> -->
    </footer>
  </body>
</html>
