appId: com.hmcldryl.generateeverypdf
productName: GenerateEveryPDF
directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json

extraResources:
  - from: templates
    to: templates

# Used by `npm run release` (electron-builder --publish always), driven by
# .github/workflows/release.yml on a `v*` tag push. Uploads the installer to
# a draft GitHub Release under this repo — publishing it live is a separate,
# manual step in the GitHub UI.
publish:
  provider: github
  owner: hmcldryl
  repo: generate-every-pdf
  releaseType: draft

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${productName}-${version}-setup.${ext}'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# Puppeteer bundles its own Chromium into node_modules/puppeteer/.local-chromium
# (or the cache dir set at install time); electron-builder must not strip it.
asarUnpack:
  - node_modules/puppeteer/**
  - node_modules/better-sqlite3/**
